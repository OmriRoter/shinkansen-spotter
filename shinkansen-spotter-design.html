<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#e9ebed" />
<title>Shinkansen Spotter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     Palette: six colour families, each with one light-context value and
     one board (dark) variant. Every colour below maps to one of these —
     no one-off hexes.
       ink / concrete+sign / tokaido blue / signal green / signal red /
       signal amber
     Train types use their real JR Central board colours, drawn from the
     same families: Nozomi = amber, Hikari = red, Kodama = blue.
     ===================================================================== */
  :root{
    /* base families */
    --ink:#1a1e23;        --ink-soft:#5b636d;     --hairline:#c9ced4;
    --concrete:#e9ebed;   --sign:#fcfdfe;
    --tokaido:#1a4f9f;    --tokaido-press:#143e7e; --tokaido-board:#7fb4ff;
    --green:#178f5f;      --green-board:#7df0a6;
    --red:#cf3a2c;        --red-board:#ff7a6b;
    --amber:#f3c216;      --amber-deep:#caa106;    --amber-board:#ffd23e;

    /* board surfaces */
    --board:#0f1411; --board-raise:#141a16; --board-edge:#262c27; --board-txt:#dee7e0; --board-dim:#7f8f85;
    --board-line:rgba(255,255,255,.09);

    /* semantic */
    --ok:var(--green); --bad:var(--red);
    --nozomi:var(--amber-board); --hikari:var(--red-board); --kodama:var(--tokaido-board);
    --led:var(--green-board);

    /* rhythm */
    --r-m:12px;   /* cards, panels, boards */
    --r-s:8px;    /* buttons, inputs, chips */
    --gap:12px;   /* space between sections */
    --pad:16px;   /* inner card padding */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    background:
      repeating-linear-gradient(90deg, transparent 0 118px, rgba(26,30,35,.05) 118px 120px),
      var(--concrete);
    color:var(--ink); min-height:100vh; line-height:1.5;
    padding:16px 14px 40px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px; margin:0 auto;}
  :focus-visible{outline:3px solid var(--tokaido); outline-offset:2px; border-radius:4px;}
  .board :focus-visible{outline-color:var(--amber-board);}

  /* ---- masthead ---- */
  .mast{display:flex; justify-content:space-between; align-items:flex-end; margin:2px 2px 14px; gap:10px;}
  .mast .line{display:flex; align-items:center; gap:9px; min-width:0;}
  .line-chip{width:14px; height:26px; background:var(--tokaido); border-radius:3px; flex:0 0 auto;}
  .mast h1{font-size:17px; font-weight:900; letter-spacing:.02em; margin:0; line-height:1.15;}
  .mast .sub{font-size:11px; color:var(--ink-soft); font-weight:700; letter-spacing:.14em; text-transform:uppercase;}
  .mast-right{text-align:right; flex:0 0 auto;}
  .clock{font-size:13px; color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums; display:block;}
  .status{display:inline-flex; align-items:center; gap:6px; font-size:10px; font-weight:900; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-soft);}
  .status .live{color:var(--ok);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--hairline); transition:background .3s;}
  .dot.on{background:var(--ok); box-shadow:0 0 0 3px rgba(23,143,95,.18);}

  /* ---- light panels ---- */
  .panel{background:var(--sign); border:1px solid var(--hairline); border-radius:var(--r-m); padding:var(--pad); margin-bottom:var(--gap); box-shadow:0 1px 0 rgba(26,30,35,.06);}
  .row{display:flex; gap:10px; align-items:center;}
  .between{justify-content:space-between;}
  .muted{color:var(--ink-soft);} .small{font-size:12.5px;}

  button{font-family:inherit; font-size:14.5px; cursor:pointer; border:none; border-radius:var(--r-s); padding:13px 14px; font-weight:700; width:100%; min-height:46px; transition:transform .06s, background .2s, border-color .2s, color .2s;}
  button:active{transform:scale(.985);}
  .btn-primary{background:var(--tokaido); color:#fff; letter-spacing:.02em;}
  .btn-primary:active{background:var(--tokaido-press);}
  label.fld{display:block; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin:14px 0 6px;}
  select{font-family:inherit; font-size:14.5px; background:var(--concrete); color:var(--ink); border:1px solid var(--hairline);
    border-radius:var(--r-s); padding:12px 13px; width:100%; min-height:46px; appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16' fill='none' stroke='%235b636d' stroke-width='1.8'><path d='M4 6l4 4 4-4'/></svg>");
    background-repeat:no-repeat; background-position:right 13px center; padding-right:38px;}
  @media (hover:hover){
    .btn-primary:hover{background:var(--tokaido-press);}
    .btn-ghost:hover{border-color:var(--board-dim);}
    select:hover{border-color:var(--ink-soft);}
  }

  /* ---- ekimeihyo: the station name sign ---- */
  .sign{background:var(--sign); border:2px solid var(--ink); border-radius:var(--r-m); overflow:hidden; margin-bottom:var(--gap); box-shadow:0 2px 0 rgba(26,30,35,.14);}
  .sign-top{padding:16px 14px 4px; text-align:center;}
  .sign-kanji{font-size:46px; font-weight:900; letter-spacing:.1em; line-height:1.1;}
  .sign-neighbors{display:flex; justify-content:space-between; gap:10px; padding:6px 12px 10px; font-size:12.5px; font-weight:700; color:var(--ink-soft);}
  .sign-neighbors span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sign-band{background:var(--tokaido); color:#fff; text-align:center; padding:7px 10px; font-weight:700; letter-spacing:.28em; text-transform:uppercase; font-size:13.5px;}

  /* ---- departure board ---- */
  .board{background:var(--board); border:2px solid var(--board-edge); border-radius:var(--r-m); padding:var(--pad); margin-bottom:var(--gap); color:var(--board-txt); position:relative; overflow:hidden;}
  .board::after{content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px);}
  .board > *{position:relative; z-index:1;}
  .board-label{font-size:10.5px; font-weight:900; letter-spacing:.22em; text-transform:uppercase; color:var(--board-dim);}
  .countdown{font-family:"DotGothic16",monospace; font-size:58px; line-height:1.05; margin:6px 0 2px; color:var(--led); text-shadow:0 0 14px rgba(125,240,166,.35); font-variant-numeric:tabular-nums; transition:color .4s;}
  .countdown.soon{color:var(--amber-board); text-shadow:0 0 14px rgba(255,210,62,.35);}
  .countdown.now{color:var(--red-board); text-shadow:0 0 14px rgba(255,122,107,.4);}
  .eta{color:var(--board-dim); font-size:13px;}
  .badges{margin-top:10px; display:flex; gap:12px; flex-wrap:wrap; font-size:13px; font-weight:700; letter-spacing:.04em;}
  .badge{display:inline-block;}
  .badge.nozomi{color:var(--nozomi);}
  .badge.hikari{color:var(--hikari);}
  .badge.kodama{color:var(--kodama);}
  .badge.dir{color:var(--board-txt);}
  .passline{margin-top:12px; font-size:13px; font-weight:500; color:var(--board-txt);}
  .passline .a{color:var(--amber-board);} .passline .b{color:var(--led);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:13px 12px; margin-top:16px; padding-top:14px; border-top:1px solid var(--board-line);}
  .kv .k{font-size:10px; font-weight:900; letter-spacing:.16em; text-transform:uppercase; color:var(--board-dim); display:block; margin-bottom:2px;}
  .kv .v{font-size:13.5px; font-weight:700; overflow-wrap:anywhere;}
  .btn-ghost{background:transparent; color:var(--board-txt); border:1px solid var(--board-line); margin-top:16px;}
  .btn-ghost.on{background:rgba(125,240,166,.1); border-color:var(--led); color:var(--led);}

  /* compass dial */
  .compass-box{width:108px; flex:0 0 auto; text-align:center;}
  .compass{width:108px; height:108px; border-radius:50%; position:relative; border:1.5px solid var(--board-line);
    background:radial-gradient(circle at 50% 40%, rgba(125,240,166,.07), transparent 62%), var(--board-raise);
    transition:transform .25s linear; margin:0 auto;}
  .compass .tick{position:absolute; color:var(--board-dim); font-size:10px; font-weight:900;}
  .compass .n{top:6px; left:50%; transform:translateX(-50%); color:var(--red-board);}
  .compass .s{bottom:6px; left:50%; transform:translateX(-50%);}
  .compass .e{right:8px; top:50%; transform:translateY(-50%);}
  .compass .w{left:8px; top:50%; transform:translateY(-50%);}
  .dial-cap{margin-top:6px; font-size:9.5px; font-weight:900; letter-spacing:.18em; text-transform:uppercase; color:var(--board-dim);}
  .arrow{position:absolute; left:50%; top:50%; width:0; height:0; transform-origin:center; transition:transform .6s cubic-bezier(.2,.8,.2,1);}
  .arrow::before{content:""; position:absolute; left:-7px; top:-41px; border-left:7px solid transparent; border-right:7px solid transparent; border-bottom:18px solid var(--led); filter:drop-shadow(0 0 6px rgba(125,240,166,.6));}
  .arrow::after{content:""; position:absolute; left:-2px; top:-23px; width:4px; height:26px; background:var(--led); border-radius:2px; opacity:.85;}

  /* ---- platform status (maru / batsu) ---- */
  .banner{border-radius:var(--r-m); padding:12px 14px; display:flex; gap:12px; align-items:flex-start; border:1px solid var(--hairline); background:var(--sign); margin-bottom:var(--gap); box-shadow:0 1px 0 rgba(26,30,35,.06);}
  .banner .ico{font-size:20px; line-height:1.2; font-weight:900; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
  .banner.clear .ico{color:var(--ok); border:2.5px solid var(--ok);}
  .banner.blocked .ico{color:var(--sign); background:var(--bad);}
  .banner.blocked{border-color:var(--bad); background:var(--sign);}
  .banner .t{font-weight:700; font-size:14px;}
  .banner .d{font-size:12.5px; color:var(--ink-soft); margin-top:2px; font-weight:400;}

  /* ---- upcoming: board rows ---- */
  .sec-title{font-size:10.5px; font-weight:900; letter-spacing:.22em; text-transform:uppercase; color:var(--board-dim); margin:0 0 8px;}
  ul.list{list-style:none; margin:0; padding:0;}
  ul.list li{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 2px; border-bottom:1px solid var(--board-line); font-size:13px;}
  ul.list li:last-child{border-bottom:none;}
  .li-left{display:flex; gap:10px; align-items:center; min-width:0;}
  .li-left .small{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .li-time{font-family:"DotGothic16",monospace; font-size:15px; color:var(--led); min-width:52px; font-variant-numeric:tabular-nums;}
  .li-right{display:flex; gap:8px; align-items:baseline; flex:0 0 auto;}
  .li-mins{font-family:"DotGothic16",monospace; font-size:14px; color:var(--board-txt); min-width:38px; text-align:right;}
  .li-plat{font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--board-dim);}
  .st-ok{color:var(--led); font-weight:900;}
  .st-no{color:var(--red-board); font-weight:900;}
  ul.list .muted{color:var(--board-dim);}

  /* ---- tactile warning strip ---- */
  .tactile{margin-top:var(--gap); background:var(--amber); border:1px solid var(--amber-deep); border-radius:var(--r-s); padding:9px 12px; display:flex; gap:12px; align-items:center; color:var(--ink); font-weight:700; font-size:12.5px;}
  .tactile .dots{flex:0 0 36px; height:36px; border-radius:4px;
    background:radial-gradient(circle, rgba(26,30,35,.32) 3.4px, transparent 3.9px); background-size:12px 12px; background-position:2px 2px;}

  .spin{display:inline-block; animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }
  @media (max-width:380px){
    .sign-kanji{font-size:38px;}
    .countdown{font-size:48px;}
    .compass-box{width:92px;}
    .compass{width:92px; height:92px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="line">
      <span class="line-chip" aria-hidden="true"></span>
      <div>
        <h1>Shinkansen Spotter</h1>
        <span class="sub">Tokaido Line 東海道新幹線</span>
      </div>
    </div>
    <div class="mast-right">
      <span class="clock" id="clock">--:--:--</span>
      <span class="status"><span id="statusDot" class="dot"></span><span id="statusLbl">Loading…</span></span>
    </div>
  </header>

  <div class="panel">
    <button class="btn-primary" id="btnLocate">Find my nearest station</button>
    <label class="fld" for="stationSel">Or choose a station</label>
    <select id="stationSel"></select>
    <div id="locInfo" class="small muted" style="margin-top:10px;"></div>
  </div>

  <div class="sign" aria-label="Station sign">
    <div class="sign-top"><div class="sign-kanji" id="signKanji">小田原</div></div>
    <div class="sign-neighbors"><span id="signLeft"></span><span id="signRight"></span></div>
    <div class="sign-band" id="signRomaji">Odawara</div>
  </div>

  <div class="board hero">
    <div class="row between" style="align-items:flex-start;">
      <div style="min-width:0;">
        <div class="board-label" id="heroLabel">Next pass-through</div>
        <div class="countdown" id="heroCountdown">--:--</div>
        <div class="eta" id="heroEta">Choose a station to begin</div>
        <div class="badges" id="heroBadges"></div>
        <div class="passline" id="heroPass"></div>
      </div>
      <div class="compass-box">
        <div class="compass" id="compass">
          <span class="tick n">N</span><span class="tick s">S</span>
          <span class="tick e">E</span><span class="tick w">W</span>
          <div class="arrow" id="arrow"></div>
        </div>
        <div class="dial-cap">Approach</div>
      </div>
    </div>
    <div class="grid2">
      <div class="kv"><span class="k">Enters from</span><span class="v" id="kvFrom">—</span></div>
      <div class="kv"><span class="k">Exits toward</span><span class="v" id="kvDir">—</span></div>
      <div class="kv"><span class="k">Track</span><span class="v" id="kvTrack">—</span></div>
      <div class="kv"><span class="k">Est. speed</span><span class="v" id="kvSpeed">—</span></div>
    </div>
    <button class="btn-ghost" id="btnCompass">Calibrate device compass</button>
  </div>

  <div class="banner clear" id="blockBanner" aria-live="polite">
    <span class="ico" aria-hidden="true">○</span>
    <div><div class="t" id="blockTitle">Track is clear</div><div class="d" id="blockDesc"></div></div>
  </div>

  <div class="board">
    <div class="sec-title row between"><span id="listTitle">Upcoming pass-throughs</span><span id="upStation"></span></div>
    <ul class="list" id="upList"><li class="muted small">—</li></ul>
  </div>

  <div class="tactile" role="note">
    <span class="dots" aria-hidden="true"></span>
    <span>Stay behind the yellow tactile line — trains pass at very high speed.</span>
  </div>
</div>

<!-- ===== engine (inlined so this file is standalone & editable) ===== -->
<script>
/* =========================================================================
   engine.js — מנוע הלו"ז המשותף של "צייד שינקנסן".
   עובד גם בדפדפן (window.Spotter) וגם ב-Node (module.exports).

   זהו "מקור האמת" היחיד: נתוני התחנות, דפוסי העצירה, חישוב אירועי מעבר,
   זיהוי כיוון/מצפן וזיהוי חסימה. גם הסימולציה וגם מסלול ה-Bright Data
   החי מחזירים אירועים באותו פורמט: { type, dir, timeMin, stops }.
   ========================================================================= */
(function (root, factory) {
  const api = factory();
  if (typeof module !== "undefined" && module.exports) module.exports = api; // Node
  root.Spotter = api;                                                        // Browser
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  /* Tokaido Shinkansen — index 0 = Tokyo (east) to Shin-Osaka (west). */
  const STATIONS = [
    { id:"tokyo",       name:"Tokyo",        jp:"東京",     lat:35.6812, lon:139.7671 },
    { id:"shinagawa",   name:"Shinagawa",    jp:"品川",     lat:35.6285, lon:139.7387 },
    { id:"shinyokohama",name:"Shin-Yokohama",jp:"新横浜",   lat:35.5079, lon:139.6173 },
    { id:"odawara",     name:"Odawara",      jp:"小田原",   lat:35.2563, lon:139.1556 },
    { id:"atami",       name:"Atami",        jp:"熱海",     lat:35.1031, lon:139.0781 },
    { id:"mishima",     name:"Mishima",      jp:"三島",     lat:35.1267, lon:138.9111 },
    { id:"shinfuji",    name:"Shin-Fuji",    jp:"新富士",   lat:35.1417, lon:138.6633 },
    { id:"shizuoka",    name:"Shizuoka",     jp:"静岡",     lat:34.9719, lon:138.3886 },
    { id:"kakegawa",    name:"Kakegawa",     jp:"掛川",     lat:34.7692, lon:137.9986 },
    { id:"hamamatsu",   name:"Hamamatsu",    jp:"浜松",     lat:34.7036, lon:137.7347 },
    { id:"toyohashi",   name:"Toyohashi",    jp:"豊橋",     lat:34.7628, lon:137.3819 },
    { id:"mikawaanjo",  name:"Mikawa-Anjo",  jp:"三河安城", lat:34.9367, lon:137.0594 },
    { id:"nagoya",      name:"Nagoya",       jp:"名古屋",   lat:35.1706, lon:136.8816 },
    { id:"gifuhashima", name:"Gifu-Hashima", jp:"岐阜羽島", lat:35.3156, lon:136.6861 },
    { id:"maibara",     name:"Maibara",      jp:"米原",     lat:35.3147, lon:136.2894 },
    { id:"kyoto",       name:"Kyoto",        jp:"京都",     lat:34.9858, lon:135.7589 },
    { id:"shinosaka",   name:"Shin-Osaka",   jp:"新大阪",   lat:34.7333, lon:135.5003 },
  ];
  const N = STATIONS.length;

  /* דפוסי עצירה אמיתיים (index בקו) לכל סוג רכבת */
  const STOPS = {
    nozomi: new Set([0,1,2,12,15,16]),
    hikari: new Set([0,1,2,3,7,12,14,15,16]),
    kodama: new Set(Array.from({length:N}, (_,i)=>i)),
  };
  const TRAIN_META = {
    nozomi:{ label:"のぞみ Nozomi", cls:"nozomi", cruise:285, dwell:1.5 },
    hikari:{ label:"ひかり Hikari", cls:"hikari", cruise:255, dwell:2.0 },
    kodama:{ label:"こだま Kodama", cls:"kodama", cruise:220, dwell:1.0 },
  };
  const SCHEDULE = [
    { type:"nozomi", headway:10, downOffset:0,  upOffset:5  },
    { type:"hikari", headway:30, downOffset:8,  upOffset:23 },
    { type:"kodama", headway:20, downOffset:3,  upOffset:13 },
  ];
  const SERVICE_START = 6*60, SERVICE_END = 23*60;

  /* ---------- גאומטריה ---------- */
  const R = 6371, toRad = d=>d*Math.PI/180, toDeg = r=>r*180/Math.PI;
  function haversine(a,b){
    const dLat=toRad(b.lat-a.lat), dLon=toRad(b.lon-a.lon);
    const s=Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(s));
  }
  function bearing(a,b){
    const y=Math.sin(toRad(b.lon-a.lon))*Math.cos(toRad(b.lat));
    const x=Math.cos(toRad(a.lat))*Math.sin(toRad(b.lat))
          - Math.sin(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.cos(toRad(b.lon-a.lon));
    return (toDeg(Math.atan2(y,x))+360)%360;
  }
  const COMPASS_EN = ["N","NE","E","SE","S","SW","W","NW"];
  const compass = deg => COMPASS_EN[Math.round(deg/45)%8];

  const CUM = (()=>{ const c=[0]; for(let i=1;i<N;i++) c[i]=c[i-1]+haversine(STATIONS[i-1],STATIONS[i]); return c; })();

  /* ---------- סימולציה דטרמיניסטית (fallback / מצב offline) ---------- */
  function eventTime(type, dir, baseMin, idx){
    const m=TRAIN_META[type], stops=STOPS[type];
    let distKm, lo, hi;
    if(dir==="down"){ distKm=CUM[idx]-CUM[0]; lo=1; hi=idx; }
    else            { distKm=CUM[N-1]-CUM[idx]; lo=idx+1; hi=N-2; }
    let travel = distKm/m.cruise*60;
    for(let i=lo;i<=hi;i++) if(stops.has(i)) travel += m.dwell;
    return baseMin + travel;
  }
  function buildSimEvents(idx){
    const out=[];
    for(const s of SCHEDULE){
      for(const dir of ["down","up"]){
        const off = dir==="down" ? s.downOffset : s.upOffset;
        for(let base=SERVICE_START+off; base<=SERVICE_END; base+=s.headway){
          const t=eventTime(s.type,dir,base,idx);
          if(t<SERVICE_START || t>SERVICE_END+30) continue;
          out.push({ type:s.type, dir, timeMin:t, stops:STOPS[s.type].has(idx) });
        }
      }
    }
    out.sort((a,b)=>a.timeMin-b.timeMin);
    return out;
  }

  /* ---------- אינטרפולציית זמן-מעבר מנתוני scraping אמיתיים ----------
     בהינתן לו"ז אמיתי של רכבת אחת (זמנים בתחנות שבהן היא כן עוצרת),
     מחשבים מתי היא חולפת בתחנה idx (שבה היא לא עוצרת) לפי מרחק יחסי
     בין שתי תחנות העצירה שעוטפות אותה.
     schedule = [{ idx, timeMin }] ממויין; dir = "down" | "up".          */
  function interpolatePass(schedule, idx, dir){
    const pts = schedule.slice().sort((a,b)=> dir==="down" ? a.idx-b.idx : b.idx-a.idx);
    for(let k=0;k<pts.length-1;k++){
      const a=pts[k], b=pts[k+1];
      const lo=Math.min(a.idx,b.idx), hi=Math.max(a.idx,b.idx);
      if(idx>lo && idx<hi){
        const frac=(CUM[idx]-CUM[lo])/(CUM[hi]-CUM[lo]);
        const tLo = a.idx===lo ? a.timeMin : b.timeMin;
        const tHi = a.idx===hi ? a.timeMin : b.timeMin;
        return tLo + frac*(tHi-tLo);
      }
    }
    return null; // התחנה מחוץ לטווח הלו"ז שנסרק
  }

  /* ---------- כיוון/מצפן + זיהוי חסימה (משותף לכל המקורות) ---------- */
  function approachBearing(idx, dir){
    if(dir==="down"){ const p=Math.max(0,idx-1); return bearing(STATIONS[idx],STATIONS[p]); }
    const p=Math.min(N-1,idx+1); return bearing(STATIONS[idx],STATIONS[p]);
  }
  function blockingTrain(events, t, dir){
    for(const e of events){
      if(!e.stops || e.dir!==dir) continue;
      const dwell = e.type==="kodama" ? 6 : (TRAIN_META[e.type]?.dwell ?? 1.5);
      if(t>=e.timeMin-0.3 && t<=e.timeMin+dwell+0.3) return { type:e.type, until:e.timeMin+dwell, platform:e.platform };
    }
    return null;
  }
  function nearestStation(lat,lon){
    let best=0,bd=Infinity;
    for(let i=0;i<N;i++){ const d=haversine({lat,lon},STATIONS[i]); if(d<bd){bd=d;best=i;} }
    return { idx:best, dist:bd };
  }

  return {
    STATIONS, STOPS, TRAIN_META, SCHEDULE, N, CUM,
    SERVICE_START, SERVICE_END,
    haversine, bearing, compass, approachBearing,
    buildSimEvents, interpolatePass, blockingTrain, nearestStation,
    indexOfId: id => STATIONS.findIndex(s=>s.id===id),
  };
});

</script>
<script>
"use strict";
const S = window.Spotter;
const $ = id => document.getElementById(id);

let stationIdx = S.indexOfId("odawara");
let events = [];
let deviceHeading = null;

// Timetables are Japan time, so compute "now" in Asia/Tokyo regardless of the device clock.
function jstParts(){
  const p = new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Tokyo",hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(new Date());
  const g = t => +p.find(x=>x.type===t).value;
  return { h:g("hour")%24, m:g("minute"), s:g("second") };
}
function nowMinutes(){ const {h,m,s}=jstParts(); return h*60 + m + s/60; }
function fmtClock(min){ const h=Math.floor(min/60)%24, m=Math.floor(min%60); return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"); }
function fmtCountdown(mins){
  if(mins<0)mins=0; const t=Math.round(mins*60);
  if(t>=3600) return Math.floor(t/3600)+"h "+String(Math.floor((t%3600)/60)).padStart(2,"0")+"m";
  return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
}
function terminalName(dir){ return dir==="down" ? S.STATIONS[S.N-1].name : S.STATIONS[0].name; }
function fromIdxOf(idx, dir){ return dir==="down" ? Math.max(0, idx-1) : Math.min(S.N-1, idx+1); }
function toIdxOf(idx, dir){ return dir==="down" ? Math.min(S.N-1, idx+1) : Math.max(0, idx-1); }

let loadSeq = 0;
async function loadEvents(){
  const seq = ++loadSeq;       // drop out-of-order responses when switching stations fast
  let live = false, got = null;
  try{
    const r = await fetch("/api/next-trains?station="+S.STATIONS[stationIdx].id);
    const j = await r.json();
    if(j.events && j.events.length){ got = j.events; live = j.source === "brightdata"; }
  }catch(e){ /* fall through to local schedule */ }
  if(seq !== loadSeq) return;
  events = got || S.buildSimEvents(stationIdx);
  setStatus(live);
  render();
}
function setStatus(live){
  $("statusDot").className = "dot" + (live ? " on" : "");
  $("statusLbl").textContent = live ? "Live" : "Demo";
  $("statusLbl").className = live ? "live" : "";
}

/* the ekimeihyo sign: current station + line neighbours (left = Tokyo side) */
function setSign(idx){
  const st = S.STATIONS[idx];
  $("signKanji").textContent = st.jp;
  $("signRomaji").textContent = st.name;
  const L = idx>0 ? S.STATIONS[idx-1] : null;
  const R = idx<S.N-1 ? S.STATIONS[idx+1] : null;
  $("signLeft").textContent  = L ? "◀ "+L.name : "";
  $("signRight").textContent = R ? R.name+" ▶" : "";
}

function selectStation(idx){
  stationIdx=idx; $("stationSel").value=S.STATIONS[idx].id;
  $("upStation").textContent = S.STATIONS[idx].name+" "+S.STATIONS[idx].jp;
  setSign(idx);
  loadEvents();
}

function setCountdown(mins){
  const cd=$("heroCountdown");
  cd.textContent = fmtCountdown(mins);
  cd.classList.toggle("now", mins<1);
  cd.classList.toggle("soon", mins>=1 && mins<3);
}

function applyGeometry(ev){
  const approach = S.approachBearing(stationIdx, ev.dir);
  const toIdx = toIdxOf(stationIdx, ev.dir), fromIdx = fromIdxOf(stationIdx, ev.dir);
  const exit = S.bearing(S.STATIONS[stationIdx], S.STATIONS[toIdx]);
  const fromName = S.STATIONS[fromIdx].name, toName = S.STATIONS[toIdx].name;
  $("kvFrom").textContent = fromName+" · "+S.compass(approach)+" "+Math.round(approach)+"°";
  $("kvDir").textContent  = toName+" · "+S.compass(exit)+" "+Math.round(exit)+"°";
  $("kvTrack").textContent = ev.dir==="down" ? "Westbound · to "+terminalName("down") : "Eastbound · to "+terminalName("up");
  setArrow(approach);
  return { approach, exit, fromName, toName };
}

function render(){
  { const {h,m,s}=jstParts(); $("clock").textContent = [h,m,s].map(n=>String(n).padStart(2,"0")).join(":")+" JST"; }
  const t = nowMinutes();
  const future = events.filter(e => e.timeMin>t);
  const passes = future.filter(e => !e.stops && (e.type==="nozomi"||e.type==="hikari"));
  const next = passes[0];
  const isMajorStop = S.STOPS.nozomi.has(stationIdx);

  if(!next){
    // Nothing passes through here (major stop or end of service) — show
    // real departures instead of an empty board.
    const deps = future.filter(e => e.stops);
    const d = deps[0];
    if(d){
      const m=S.TRAIN_META[d.type], dest=d.dest||terminalName(d.dir);
      $("heroLabel").textContent = "Next departure";
      setCountdown(d.timeMin-t);
      $("heroEta").textContent = "Departs at "+fmtClock(d.timeMin)+" · "+m.label+(d.platform!=null?" · Platform "+d.platform:"");
      $("heroBadges").innerHTML =
        `<span class="badge ${m.cls}">${m.label}</span>`+
        `<span class="badge dir">${d.dir==="down"?"▶":"◀"} to ${dest}</span>`;
      $("heroPass").textContent = isMajorStop ? "Fast trains stop here — try an intermediate station to photograph pass-throughs." : "";
      applyGeometry(d);
      $("kvSpeed").textContent = "Stops here";
      setBanner(null);
      $("listTitle").textContent = "Upcoming departures";
      renderList(deps, "dep");
      return;
    }
    $("heroLabel").textContent = "Quiet right now";
    $("heroCountdown").textContent="--:--";
    $("heroCountdown").classList.remove("soon","now");
    $("heroEta").textContent = "No more trains today. Service runs roughly 06:00–23:00 JST.";
    $("heroBadges").innerHTML=""; $("heroPass").textContent=""; setArrow(0);
    ["kvFrom","kvDir","kvTrack","kvSpeed"].forEach(k=>$(k).textContent="—");
    setBanner(null);
    $("listTitle").textContent = "Upcoming pass-throughs";
    renderList([], "pass");
    return;
  }

  const m=S.TRAIN_META[next.type], dt=next.timeMin-t;
  const dest = next.dest || terminalName(next.dir);
  $("heroLabel").textContent = "Next pass-through";
  setCountdown(dt);
  $("heroEta").textContent = "Passes at "+fmtClock(next.timeMin)+" · "+m.label;
  $("heroBadges").innerHTML =
    `<span class="badge ${m.cls}">${m.label}</span>`+
    `<span class="badge dir">${next.dir==="down"?"▶":"◀"} to ${dest}</span>`;

  const g = applyGeometry(next);
  $("heroPass").innerHTML =
    `Passes <span class="a">${g.fromName} side (${S.compass(g.approach)})</span> ▶ <span class="b">${g.toName} side (${S.compass(g.exit)})</span>`;
  $("kvSpeed").textContent = "~"+m.cruise+" km/h";

  setBanner(S.blockingTrain(events, next.timeMin, next.dir));
  $("listTitle").textContent = "Upcoming pass-throughs";
  renderList(passes, "pass");
}

function setArrow(b){ $("arrow").style.transform = "translate(-50%,-50%) rotate("+b+"deg)"; applyDial(); }
function applyDial(){ $("compass").style.transform = deviceHeading==null ? "rotate(0deg)" : "rotate("+(-deviceHeading)+"deg)"; }

/* platform status — maru for clear, batsu for blocked */
function setBanner(blk){
  const b=$("blockBanner");
  if(!blk){
    b.className="banner clear"; b.querySelector(".ico").textContent="○";
    $("blockTitle").textContent="Track is clear";
    $("blockDesc").textContent="No standing train should block your shot.";
  } else {
    const m=S.TRAIN_META[blk.type], plat=(blk.platform!=null)?" at platform "+blk.platform:"";
    b.className="banner blocked"; b.querySelector(".ico").textContent="×";
    $("blockTitle").textContent="A "+m.label.split(" ").pop()+" is stopping"+plat;
    $("blockDesc").textContent="It may block the view until ~"+fmtClock(blk.until)+". Move to the other side of the platform.";
  }
}

function renderList(items, mode){
  const t=nowMinutes(), ul=$("upList"), rows=items.slice(0,7);
  if(!rows.length){ ul.innerHTML='<li class="muted small">Nothing upcoming right now</li>'; return; }
  ul.innerHTML = rows.map(e=>{
    const m=S.TRAIN_META[e.type], dest=e.dest||terminalName(e.dir);
    let right;
    if(mode==="dep"){
      right = (e.platform!=null ? '<span class="li-plat">Plat. '+e.platform+'</span>' : "")+
        `<span class="li-mins">${Math.round(e.timeMin-t)}m</span>`;
    } else {
      const blk=S.blockingTrain(events, e.timeMin, e.dir);
      right = (blk?'<span class="st-no" title="View may be blocked by a stopping train">×</span>'
                  :'<span class="st-ok" title="Clear view">○</span>')+
        `<span class="li-mins">${Math.round(e.timeMin-t)}m</span>`;
    }
    return `<li><span class="li-left"><span class="li-time">${fmtClock(e.timeMin)}</span>`+
      `<span class="badge ${m.cls}">${m.label.split(" ").pop()}</span>`+
      `<span class="small muted">${e.dir==="down"?"▶":"◀"} ${dest}</span></span>`+
      `<span class="li-right">${right}</span></li>`;
  }).join("");
}

/* live device compass */
function onOrient(e){
  let h=null;
  if(typeof e.webkitCompassHeading==="number") h=e.webkitCompassHeading;
  else if(e.absolute && typeof e.alpha==="number") h=(360-e.alpha)%360;
  if(h!=null && isFinite(h)){ deviceHeading=h; applyDial(); }
}
async function enableCompass(){
  try{
    if(typeof DeviceOrientationEvent!=="undefined" && typeof DeviceOrientationEvent.requestPermission==="function"){
      if(await DeviceOrientationEvent.requestPermission()!=="granted"){ return; }
    }
    window.addEventListener("deviceorientationabsolute", onOrient, true);
    window.addEventListener("deviceorientation", onOrient, true);
    $("btnCompass").textContent="Compass on — turn to face the arrow";
    $("btnCompass").classList.add("on");
  }catch(err){ $("btnCompass").textContent="Compass unavailable"; }
}
$("btnCompass").addEventListener("click", enableCompass);

/* GPS */
$("btnLocate").addEventListener("click", ()=>{
  if(!navigator.geolocation){ $("locInfo").textContent="Geolocation isn't supported here."; return; }
  $("btnLocate").innerHTML='<span class="spin">◌</span> Locating…';
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:lat, longitude:lon}=pos.coords;
    const {idx,dist}=S.nearestStation(lat,lon);
    selectStation(idx);
    const inJapan = lat>24 && lat<46 && lon>122 && lon<154;
    $("btnLocate").textContent="Find my nearest station";
    $("locInfo").innerHTML = (inJapan?"":"You're not in Japan — showing a demo. ")+
      "Nearest: <b>"+S.STATIONS[idx].name+"</b> ("+S.STATIONS[idx].jp+") · "+dist.toFixed(1)+" km away.";
  }, err=>{
    $("btnLocate").textContent="Find my nearest station";
    $("locInfo").textContent="Couldn't locate you. Choose a station manually.";
  }, { enableHighAccuracy:true, timeout:10000, maximumAge:30000 });
});

/* init */
(function init(){
  $("stationSel").innerHTML = S.STATIONS.map((st,i)=>{
    const tag = S.STOPS.nozomi.has(i) ? " — major stop" : (S.STOPS.hikari.has(i) ? "" : " · photo spot");
    return `<option value="${st.id}">${st.name} ${st.jp}${tag}</option>`;
  }).join("");
  $("stationSel").addEventListener("change", e=> selectStation(S.indexOfId(e.target.value)));
  selectStation(stationIdx);
  setInterval(render, 1000);
  setInterval(loadEvents, 300000);   // refresh timetable data every 5 minutes
})();
</script>
</body>
</html>
